name: Build Windows exe

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build
        run: pyinstaller --noconfirm --onedir --windowed --noupx --runtime-hook pdfstudio_rthook.py --exclude-module pymupdf4llm --exclude-module pymupdf.layout --exclude-module pymupdf_layout --exclude-module onnxruntime --exclude-module numpy --exclude-module networkx --exclude-module yaml --exclude-module psutil --exclude-module tabulate --exclude-module tkinter --exclude-module unittest --exclude-module pydoc --hidden-import fontTools.subset --collect-submodules fontTools.ttLib --name PDFStudio --icon pdfstudio.ico pdf_studio.py
      - name: Keep Qt's ICU binding compatible with Windows
        shell: pwsh
        run: |
          # PyMuPDF can contribute ICU 78 with suffixed exports. Qt 6.11 expects
          # the Windows ICU ABI (ucnv_open), so let Windows resolve its system ICU.
          Remove-Item -LiteralPath dist/PDFStudio/_internal/icuuc.dll -Force -ErrorAction SilentlyContinue
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/PDFStudio -DestinationPath PDFStudio-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: PDFStudio-windows
          path: |
            PDFStudio-windows.zip
      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            PDFStudio-windows.zip
